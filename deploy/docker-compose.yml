# Stwrd — production deployment (spec §19.1).
#
# Usage:
#   1. cp .env.example .env  — fill in SITE_ORIGIN, INSTANCE_NAME/SECRET, ORG_NAME
#   2. docker compose up -d
#   3. docker compose logs bootstrap   # credentials printed here on first run
#   4. cat secrets/server-manager-credentials.txt
#
# The bootstrap service runs once, deploys functions, generates secrets, and
# creates the server-manager account. Subsequent `up -d` calls are safe — it
# detects the provisioned state and exits immediately.
#
# Image digests are pinned (never `latest`, per §4).

services:
  backend:
    image: ghcr.io/convex/convex-backend@sha256:edd7959f3464ed661f6663f646db205d5d61bda606c969b074dfb3c69ed71463
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME}
      - INSTANCE_SECRET=${INSTANCE_SECRET}
      # CONVEX_CLOUD_ORIGIN: client API origin the browser connects to (websocket + HTTP).
      # Equals SITE_ORIGIN + /api — set explicitly in .env.
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN}
      # CONVEX_SITE_ORIGIN: where the backend resolves its own JWKS and auth endpoints.
      # Always the backend's internal Docker address — never needs to change.
      - CONVEX_SITE_ORIGIN=http://backend:3211
      - POSTGRES_URL=${POSTGRES_URL:-}
      - DISABLE_BEACON=true
      - REDACT_LOGS_TO_CLIENT=${REDACT_LOGS_TO_CLIENT:-true}
    volumes:
      - data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:3210:3210"
      - "127.0.0.1:3211:3211"

  bootstrap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bootstrap
    restart: "no"
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME}
      - INSTANCE_SECRET=${INSTANCE_SECRET}
      - SITE_ORIGIN=${SITE_ORIGIN}
      - ORG_NAME=${ORG_NAME:-My Library}
      - SERVER_MANAGER_EMAIL=${SERVER_MANAGER_EMAIL:-}
      - SERVER_MANAGER_PASSWORD=${SERVER_MANAGER_PASSWORD:-}
    volumes:
      # :z relabels the directory for SELinux (needed on Fedora/RHEL hosts)
      - ./secrets:/secrets:z
    depends_on:
      backend:
        condition: service_healthy

  dashboard:
    image: ghcr.io/convex/convex-dashboard@sha256:bbc4d2c43d19fd6f2791dd6c5153a76e127f3eea489c1639e5acf66999c216bf
    ports:
      - "127.0.0.1:6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      - SITE_ORIGIN=${SITE_ORIGIN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      start_period: 15s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PROXY_HOSTNAME=${PROXY_HOSTNAME}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  data: {}
  caddy_data: {}
  caddy_config: {}
